const defaults={items:seed,logs:[],ideas:[],params:[30,75,45,55,35],rain:true,occasion:'Lavoro',plan:[],palette:['#e6ddc7','#a7bed2','#34465b','#713747','#b89a77','#292929'],times:['21:30','22:00','07:30']};let S;try{S=JSON.parse(localStorage.getItem('cmm-v1'))||defaults}catch{S=defaults}let tab='Oggi',proposal=[],selected=[],logPhoto='',ideaPhoto='',editPhoto='',editing=null;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('cmm-v1',JSON.stringify(S));return true}catch{toast('Spazio locale esaurito: esporta i dati.');return false}}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}const cats=['Gonna','Top','Pantaloni','Scarpe','Capospalla','Abito','Accessori'];const labels=['Casual','Eleganza','Formalità','Comfort','Creatività'];const today=()=>new Date().toLocaleDateString('sv-SE');function img(x){if(x.photo)return `<img src="${esc(x.photo)}" alt="${esc(x.name)}">`;let p=x.cat==='Pantaloni'?'M38 18H82L88 100H65L60 48L55 100H32Z':x.cat==='Scarpe'?'M23 60L41 60L48 42L62 42L65 67L93 80Q99 94 84 94H24Q14 90 23 60Z':x.cat==='Accessori'?'M35 42H85L92 96H28Z':'M43 20L25 26L9 56L28 66L37 47L37 100H83V47L92 66L111 56L95 26L77 20Q60 38 43 20Z';return `<svg viewBox="0 0 120 120" aria-label="Sagoma illustrativa"><path d="${p}" fill="${esc(x.color)}" stroke="#777" stroke-width=".6"/></svg>`}function piece(x,action='',label=''){return `<div class="piece">${img(x)}<strong>${esc(x.name)}</strong><small><i class="swatch" style="background:${esc(x.color)}"></i> ${esc(x.status)}</small>${action?`<button class="alt" onclick="${action}">${label}</button>`:''}</div>`}function eligible(c){return S.items.filter(x=>x.cat===c&&x.status==='Pronto'&&(!S.rain||!['Scarpe','Capospalla'].includes(c)||x.rain)).sort((a,b)=>score(a)-score(b))}function score(x){let base=x.scores.reduce((n,v,i)=>n+Math.abs(v-S.params[i]),0);for(const l of S.logs.slice(-30)){if(!l.ids.includes(x.id))continue;if(l.occasion===S.occasion){if(l.rating==='Mi valorizza')base-=4;if(l.rating==='Non mi convince')base+=4}if(l.rain===S.rain&&l.thermal==='Troppo caldo'&&['Top','Capospalla'].includes(x.cat))base+=12;if(l.rain===S.rain&&l.thermal==='Troppo freddo'&&['Top','Capospalla'].includes(x.cat))base+=8;if(l.occasion===S.occasion&&l.issue==='Poco pratico'&&l.issueId===x.id)base+=20}return base}function generate(){proposal=['Top','Pantaloni','Scarpe','Capospalla'].map(c=>eligible(c)[0]?.id).filter(Boolean)}function swap(c){let a=eligible(c),i=proposal.findIndex(id=>S.items.find(x=>x.id===id)?.cat===c);if(a.length<2){toast('Nessuna alternativa disponibile');return}proposal[i]=a[(a.findIndex(x=>x.id===proposal[i])+1)%a.length].id;render()}function param(i,v){S.params[i]=+v;save();$('v'+i).textContent=v}function go(t){tab=t;editing=null;render()}function readPhoto(f,cb){if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),k=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.76))};im.onerror=()=>toast('Formato non leggibile. Prova JPEG o PNG.');im.src=r.result};r.readAsDataURL(f)}function render(){document.body.dataset.tab=tab;let html='';$('nav').innerHTML=['Oggi','Armadio','Look','Diario','Analisi'].map((t,i)=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><b>${["<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><path d=\"M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4 18.4 5.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><rect x=\"2\" y=\"2\" width=\"9\" height=\"9\" rx=\"3\"/><rect x=\"13\" y=\"2\" width=\"9\" height=\"9\" rx=\"3\"/><rect x=\"2\" y=\"13\" width=\"9\" height=\"9\" rx=\"3\"/><rect x=\"13\" y=\"13\" width=\"9\" height=\"9\" rx=\"3\"/></svg>", "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><path d=\"M10 2Q11 2 12 6Q13 9 17 10Q21 11 17 13Q13 14 12 18Q10 22 9 18Q8 14 4 13Q0 11 4 10Q8 9 9 5Q10 2 10 2Z\"/><path d=\"M20 1Q21 4 24 5Q21 6 20 9Q19 6 16 5Q19 4 20 1Z\"/></svg>", "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.7\"/><path d=\"M7 8h10M7 12h10M7 16h6\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><circle cx=\"12\" cy=\"12\" r=\"8.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"5\"/><path d=\"M12 3.5a8.5 8.5 0 0 1 8.5 8.5\" fill=\"none\" stroke=\"#8298AD\" stroke-width=\"5\"/></svg>"][i]}</b>${t}</button>`).join('');if(tab==='Oggi'){if(!proposal.length)generate();html=`<section class="weather"><b>${S.rain?'☂':'☀'}</b><div><strong>${S.rain?'6–11 °C · Pioggia':'12–18 °C · Sereno'}</strong><br><small>Meteo simulato</small></div><button class="alt" onclick="S.rain=!S.rain;save();generate();render()">Cambia</button></section><section><h2>E domani?</h2><select onchange="S.occasion=this.value;save()">${['Lavoro','Tempo libero','Evento'].map(o=>`<option ${o===S.occasion?'selected':''}>${o}</option>`).join('')}</select><details open><summary style="margin-top:12px">Come vuoi vestirti?</summary>${labels.map((l,i)=>`<label>${l}<span id="v${i}">${S.params[i]}</span><input type="range" min="0" max="100" step="5" value="${S.params[i]}" oninput="param(${i},this.value)"></label>`).join('')}</details><button class="full" onclick="generate();render()">Proponimi un look</button></section><section><h2>Il look di domani</h2><p>${S.rain?'Chic sì, piedi bagnati no.':'Poco sforzo, molta resa.'}</p><div class="grid">${proposal.map(id=>S.items.find(x=>x.id===id)).filter(Boolean).map(x=>piece(x,`swap('${x.cat}')`,'↻ Cambia')).join('')}</div>${proposal.length<4?'<small>Alcune categorie non hanno capi adatti disponibili.</small>':''}<button class="full" onclick="S.plan=[...proposal];save();toast('Look salvato')">Salva per domani</button></section><section><h2>Come ti sei vestita oggi?</h2><button class="full" onclick="go('Diario')">＋ Registra outfit</button></section><details><summary>Notifiche (simulazione)</summary>${['Diario','Look di domani','Controllo meteo'].map((n,i)=>`<label>${n} <input type="time" value="${S.times[i]}" onchange="S.times[${i}]=this.value;save()"></label>`).join('')}<small>Orari salvati; nessuna notifica reale nella demo.</small></details>`}else if(tab==='Armadio'){html=`<h2>Il mio armadio</h2><button onclick="editing='new';editPhoto='';render()">＋ Aggiungi capo</button>`;if(editing){let x=S.items.find(z=>z.id===editing)||{name:'',cat:'Top',color:'#777777',size:'',status:'Pronto',rain:false,scores:[50,50,50,50,50]};html+=`<section><h2>${editing==='new'?'Nuovo capo':'Modifica capo'}</h2><input type="file" accept="image/*" onchange="readPhoto(this.files[0],p=>{editPhoto=p;$('editpreview').src=p;$('editpreview').classList.remove('hidden')})"><img id="editpreview" class="photo ${editPhoto||x.photo?'':'hidden'}" src="${editPhoto||x.photo||''}"><label>Nome <input id="name" class="wide" value="${esc(x.name)}"></label><label>Categoria <select id="cat">${cats.map(c=>`<option ${c===x.cat?'selected':''}>${c}</option>`).join('')}</select></label><label>Colore <input id="color" type="color" value="${esc(x.color)}"></label><label>Taglia <input id="size" value="${esc(x.size)}"></label><label>Stagione <select id="season">${['Tutto l’anno','Autunno / Inverno','Primavera / Estate'].map(v=>`<option ${v===(x.season||'Tutto l’anno')?'selected':''}>${v}</option>`).join('')}</select></label><label>Stato <select id="status">${['Pronto','Da lavare','Da stirare','Da riparare','Da vendere'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></label><label><input id="rainok" type="checkbox" ${x.rain?'checked':''}> Adatto alla pioggia</label><details><summary>Parametri stile</summary>${labels.map((l,i)=>`<label>${l}<input id="sc${i}" type="range" min="0" max="100" value="${x.scores[i]}"></label>`).join('')}</details><button onclick="saveItem()">Salva</button> <button class="alt" onclick="editing=null;render()">Annulla</button>${editing!=='new'?` <button class="alt" onclick="removeItem()">Elimina</button>`:''}</section>`}html+=`<section><small>${S.items.length} capi · i capi iniziali sono esempi</small><label>Filtra <select id="filter" onchange="filterItems(this.value)"><option>Tutti</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select></label><div class="grid" id="items">${S.items.map(x=>piece(x,`edit('${x.id}')`,'Modifica')).join('')}</div></section>`}else if(tab==='Look'){html=`<h2>I miei look</h2><section><h2>Come mi sono vestita?</h2><p>Uno scatto e via.</p>${photoControls()}<button class="alt" onclick="resetDraft();go('Diario')">Registra senza foto</button></section><h2>Idee di stile</h2><section><label>Carica un'ispirazione <input type="file" accept="image/*" onchange="readPhoto(this.files[0],p=>{S.ideas.push(p);save();render()})"></label><small>Archivio fotografico; analisi AI non collegata.</small></section><div class="grid">${S.ideas.map((p,i)=>`<div class="piece"><img src="${p}"><button class="alt" onclick="S.ideas.splice(${i},1);save();render()">Rimuovi</button></div>`).join('')}</div><section><h2>Look salvato</h2><div class="grid">${S.plan.map(id=>S.items.find(x=>x.id===id)).filter(Boolean).map(x=>piece(x)).join('')||'<small>Nessun look salvato.</small>'}</div></section>` }else if(tab==='Diario'){html=diary()}else{let period=periodInfo(periodOffset),logs=S.logs.filter(l=>l.date>=period.start&&l.date<period.end),pool=S.items.filter(x=>!x.season||x.season==='Tutto l’anno'||x.season===period.season||logs.some(l=>l.ids.includes(x.id))),counts=pool.map(x=>({x,n:logs.filter(l=>l.ids.includes(x.id)).length})).sort((a,b)=>b.n-a.n),used=counts.filter(a=>a.n>0).length;html=`<h2>Cosa metto davvero</h2><section><div class="row"><button class="alt" onclick="periodOffset--;render()">‹</button><strong style="flex:1;text-align:center">${period.label}</strong><button class="alt" onclick="periodOffset++;render()" ${periodOffset===0?'disabled':''}>›</button></div><h2>${pool.length?Math.round(100*used/pool.length):0}%</h2><small>Guardaroba stagionale utilizzato · ${used}/${pool.length} capi</small><p><small>${logs.length} outfit · ${new Set(logs.map(l=>l.date)).size} giorni registrati</small></p><div class="bar"><i style="width:${pool.length?100*used/pool.length:0}%"></i></div>${counts.map(a=>`<p>${esc(a.x.name)} <strong style="float:right">${a.n}</strong></p>`).join('')}</section><section><h2>I miei colori</h2>${S.palette.map((c,i)=>`<input type="color" value="${c}" onchange="S.palette[${i}]=this.value;save();render()">`).join(' ')}<p><small>Colori senza corrispondenze vicine (stima RGB)</small></p>${S.palette.filter(c=>!S.items.some(x=>dist(c,x.color)<65)).map(c=>`<i class="swatch" style="background:${c};width:35px;height:35px"></i> `).join('')||'Nessuno'}</section><section><h2>Ti metto ancora?</h2><small>Non registrati nel semestre selezionato; non significa che siano da vendere.</small>${counts.filter(a=>!a.n).map(a=>`<p>${esc(a.x.name)}</p>`).join('')}</section><section><button onclick="backup()">Esporta dati</button> <label>Ripristina backup <input type="file" accept="application/json" onchange="restore(this.files[0])"></label><button class="alt" onclick="clearExamples()">Rimuovi capi di esempio</button></section>`} $('view').innerHTML=html}
function dist(a,b){let v=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));return Math.hypot(...v(a).map((x,i)=>x-v(b)[i]))}function edit(id){editing=id;editPhoto='';render()}function filterItems(c){$('items').innerHTML=S.items.filter(x=>c==='Tutti'||x.cat===c).map(x=>piece(x,`edit('${x.id}')`,'Modifica')).join('')}function saveItem(){if(!$('name').value.trim()){toast('Inserisci un nome');return}let old=S.items.find(x=>x.id===editing),x={id:old?.id||'i'+Date.now(),name:$('name').value,cat:$('cat').value,color:$('color').value,size:$('size').value,status:$('status').value,season:$('season').value,rain:$('rainok').checked,scores:labels.map((_,i)=>+$('sc'+i).value),photo:editPhoto||old?.photo||''};S.items=S.items.filter(z=>z.id!==x.id).concat(x);save();editing=null;generate();render()}function removeItem(){if(confirm('Eliminare il capo?')){S.items=S.items.filter(x=>x.id!==editing);save();editing=null;generate();render()}}function toggle(id,on){selected=on?[...new Set([...selected,id])]:selected.filter(x=>x!==id)}function record(){if(!selected.length&&!logPhoto){toast('Aggiungi foto o capi');return}if(!draft.date){toast('Scegli una data');return}let entry={id:draft.id||'l'+Date.now(),date:draft.date,slot:draft.slot,ids:[...selected],photo:logPhoto,rating:draft.rating,note:draft.note,thermal:draft.thermal,issue:draft.issue,issueId:draft.issueId,occasion:draft.occasion,rain:draft.rain};let old=S.logs;S.logs=old.filter(l=>l.id!==entry.id).concat(entry);if(save()){let date=draft.date;resetDraft(date);generate();render();toast('Outfit registrato')}else S.logs=old}
let periodOffset=0;function periodInfo(offset){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),base=m>=9?9:m>=3?3:9;if(m<3)y--;let start=new Date(y,base+offset*6,1),end=new Date(start.getFullYear(),start.getMonth()+6,1),winter=start.getMonth()===9;return {start:start.toLocaleDateString('sv-SE'),end:end.toLocaleDateString('sv-SE'),season:winter?'Autunno / Inverno':'Primavera / Estate',label:(winter?'Ott–Mar':'Apr–Set')+' '+start.getFullYear()+(winter?' / '+end.getFullYear():'')}}
function fresh(date=today()){return {date,slot:'',rating:'',thermal:'',issue:'',issueId:'',note:'',occasion:S.occasion,rain:S.rain}}let draft=fresh();function resetDraft(date){draft=fresh(date);selected=[];logPhoto=''}function choose(k,v){draft[k]=draft[k]===v?'':v;if(k==='issue'&&!draft.issue)draft.issueId='';render()}function chips(k,values){return `<div class="chips">${values.map(v=>`<button class="chip" aria-pressed="${draft[k]===v}" onclick="choose('${k}','${v}')">${v}</button>`).join('')}</div>`}function editLog(id){let l=S.logs.find(x=>x.id===id);if(!l)return;draft={...fresh(l.date),...l};selected=[...l.ids];logPhoto=l.photo||'';render();window.scrollTo(0,0)}function photoControls(){return `<div class="row photo-actions"><button onclick="document.getElementById('cameraPhoto').click()">📷 Scatta foto</button><button class="alt" onclick="document.getElementById('galleryPhoto').click()">Dalla galleria</button><input id="cameraPhoto" type="file" accept="image/*" capture="environment" class="hidden" onchange="captureLook(this.files[0])"><input id="galleryPhoto" type="file" accept="image/*" class="hidden" onchange="captureLook(this.files[0])"></div>`}function captureLook(file){if(!file)return;let fromLook=tab==='Look';readPhoto(file,p=>{if(fromLook)resetDraft(today());logPhoto=p;go('Diario');window.scrollTo(0,0)})}function diary(){let groups=[...new Set(S.logs.map(l=>l.date))].sort().reverse();return `<h2>Come mi sono vestita</h2><section><h2>${draft.id?'Modifica look':'Aggiungi look'}</h2><label>Data <input type="date" value="${esc(draft.date)}" onchange="draft.date=this.value"></label>${chips('slot',['Mattina','Pomeriggio','Sera','Tutto il giorno'])}${photoControls()}${logPhoto?`<img class="photo lookphoto" src="${logPhoto}">`:''}<small>Seleziona i capi (AI non ancora attiva).</small><p><button class="alt" onclick="selected=[...S.plan];render()">Usa look salvato</button></p><div class="loggrid">${S.items.map(x=>`<label class="piece">${img(x)}<input type="checkbox" ${selected.includes(x.id)?'checked':''} onchange="toggle('${x.id}',this.checked)"> ${esc(x.name)}</label>`).join('')}</div><label>Occasione</label>${chips('occasion',['Lavoro','Cantiere','Tempo libero','Evento'])}<label>Come ti sei sentita?</label>${chips('rating',['Mi valorizza','Bene','Così così','Non mi convince'])}<label>Comfort termico</label>${chips('thermal',['Giusta','Troppo caldo','Troppo freddo'])}<label>Praticità</label>${chips('issue',['Poco pratico'])}${draft.issue?`<div class="chips">${S.items.filter(x=>selected.includes(x.id)).map(x=>`<button class="chip" aria-pressed="${draft.issueId===x.id}" onclick="choose('issueId','${x.id}')">${esc(x.name)}</button>`).join('')}</div>`:''}<label>Nota per la prossima volta <textarea rows="3" class="wide" style="font:inherit;border:1px solid #d8d9cf;border-radius:9px;padding:9px" oninput="draft.note=this.value" placeholder="Troppo caldo, gonna poco pratica…">${esc(draft.note)}</textarea></label><button class="full" onclick="record()">${draft.id?'Salva modifiche':'Registra look'}</button>${draft.id?'<button class="alt full" onclick="resetDraft();render()">Annulla</button>':''}</section>${groups.map(date=>{let entries=S.logs.filter(l=>l.date===date);return `<section><h2>${esc(date)}</h2><small>${entries.length} look</small>${entries.map((l,i)=>`<div style="border-top:1px solid #ddd;margin-top:12px;padding-top:12px"><strong>${esc(l.slot||'Look '+(i+1))} ${l.rating?'· '+esc(l.rating):''}</strong>${l.photo?`<img class="photo lookphoto" src="${l.photo}">`:''}<p>${l.ids.map(id=>esc(S.items.find(x=>x.id===id)?.name||'Capo rimosso')).join(' · ')}</p>${l.note?`<p><em>${esc(l.note)}</em></p>`:''}<small>${[l.occasion,l.thermal,l.issue].filter(Boolean).map(esc).join(' · ')}</small><div class="row"><button class="alt" onclick="editLog('${l.id}')">Modifica</button><button class="alt" onclick="if(confirm('Eliminare questo look?')){S.logs=S.logs.filter(x=>x.id!=='${l.id}');save();render()}">Elimina</button></div></div>`).join('')}<button class="full alt" onclick="resetDraft('${date}');render();window.scrollTo(0,0)">＋ Altro look</button></section>`}).join('')}`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='che-mi-metto-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(f){if(!f)return;f.text().then(t=>{try{let d=JSON.parse(t);if(!Array.isArray(d.items)||!Array.isArray(d.logs)||!Array.isArray(d.params)||!Array.isArray(d.palette)||!Array.isArray(d.ideas)||!Array.isArray(d.times))throw 0;if(confirm('Sostituire i dati attuali?')){S=d;save();generate();render()}}catch{toast('Backup non valido')}})}function clearExamples(){if(confirm('Rimuovere tutti i capi dimostrativi?')){S.items=S.items.filter(x=>!/^s\d+$/.test(x.id));save();generate();render()}}render();

</script></html>
